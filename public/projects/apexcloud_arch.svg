<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121c42"/>
      <stop offset="100%" stop-color="#090f26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g opacity="0.15" stroke="#00e5ff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="600" cy="375" r="260" fill="#00e5ff" opacity="0.06" filter="url(#glow)"/>
  <circle cx="200" cy="375" r="180" fill="#6c63ff" opacity="0.08" filter="url(#glow)"/>

  <!-- Header Banner -->
  <rect x="60" y="50" width="1080" height="70" rx="14" fill="#0e1738" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="90" y="93" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" letter-spacing="1">APEXCLOUD // DISTRIBUTED REVERSE PROXY &amp; API GATEWAY</text>
  <rect x="960" y="68" width="150" height="32" rx="16" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1"/>
  <text x="982" y="89" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">HIGH-THROUGHPUT</text>

  <!-- 1. Client Ingress Node -->
  <rect x="70" y="270" width="180" height="210" rx="18" fill="url(#cardGrad)" stroke="#6c63ff" stroke-width="1.5"/>
  <rect x="70" y="270" width="180" height="40" rx="18" fill="#6c63ff" fill-opacity="0.15"/>
  <text x="95" y="296" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">CLIENT TRAFFIC</text>
  <text x="95" y="345" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">HTTP/2 &amp; REST</text>
  <text x="95" y="375" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Concurrent Requests</text>
  <text x="95" y="405" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">TLS Termination</text>
  <text x="95" y="445" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">INBOUND PORT :443</text>

  <!-- Flow Arrow 1: Client -> Gateway -->
  <path d="M 250 375 L 360 375" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="365,375 355,370 355,380" fill="#00e5ff"/>
  <text x="268" y="360" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">AUTH HEADERS</text>

  <!-- 2. Gateway Core Controller (Center Stage) -->
  <rect x="370" y="190" width="460" height="370" rx="22" fill="#0c1435" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow)"/>
  <rect x="370" y="190" width="460" height="48" rx="22" fill="#141f4d"/>
  <text x="400" y="221" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">APEX GATEWAY CORE ENGINE</text>
  <circle cx="800" cy="214" r="6" fill="#10b981"/>

  <!-- Module 1: Token Bucket Rate Limiting -->
  <rect x="400" y="260" width="400" height="75" rx="12" fill="#121d45" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="420" y="290" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">1. TOKEN-BUCKET RATE LIMITER</text>
  <text x="420" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Sliding-window evaluation with Redis key expiration</text>

  <!-- Module 2: JWT Security Inspection -->
  <rect x="400" y="355" width="400" height="75" rx="12" fill="#121d45" stroke="#6c63ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="420" y="385" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">2. IDENTITY &amp; JWT VERIFICATION</text>
  <text x="420" y="413" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Claim extraction, cryptographic validation &amp; RBAC checks</text>

  <!-- Module 3: Reverse Proxy & Health Probing -->
  <rect x="400" y="450" width="400" height="85" rx="12" fill="#121d45" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="420" y="480" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">3. ZERO-DOWNTIME REVERSE PROXY</text>
  <text x="420" y="508" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Active health probe pings &amp; weighted round-robin distribution</text>

  <!-- Flow Arrows: Gateway -> Upstream Services -->
  <path d="M 830 310 L 930 250" stroke="#00e5ff" stroke-width="2"/>
  <polygon points="935,247 925,246 929,255" fill="#00e5ff"/>

  <path d="M 830 375 L 930 375" stroke="#00e5ff" stroke-width="2"/>
  <polygon points="935,375 925,370 925,380" fill="#00e5ff"/>

  <path d="M 830 440 L 930 500" stroke="#00e5ff" stroke-width="2"/>
  <polygon points="935,503 929,495 925,504" fill="#00e5ff"/>

  <!-- 3. Upstream Microservices Stack -->
  <!-- Microservice A -->
  <rect x="940" y="195" width="200" height="95" rx="14" fill="url(#cardGrad)" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="960" y="230" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">SERVICE // AUTH</text>
  <text x="960" y="255" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Port :8081 • Spring Boot</text>
  <text x="960" y="275" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● HEALTH: 200 OK</text>

  <!-- Microservice B -->
  <rect x="940" y="325" width="200" height="95" rx="14" fill="url(#cardGrad)" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="960" y="360" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">SERVICE // CORE API</text>
  <text x="960" y="385" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Port :8082 • NestJS/Node</text>
  <text x="960" y="405" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● HEALTH: 200 OK</text>

  <!-- Microservice C -->
  <rect x="940" y="455" width="200" height="95" rx="14" fill="url(#cardGrad)" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="960" y="490" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">SERVICE // DATA</text>
  <text x="960" y="515" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Port :8083 • .NET / SQL</text>
  <text x="960" y="535" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● HEALTH: 200 OK</text>

  <!-- Bottom Technical Metrics Footer -->
  <rect x="60" y="625" width="1080" height="75" rx="14" fill="#090f26" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  <text x="90" y="668" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ARCHITECTURE STACK:</text>
  <text x="250" y="668" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">Node.js • TypeScript • Redis Cache • Docker Containerization • NGINX Reverse Proxy</text>
</svg>
